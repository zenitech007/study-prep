    <!-- Safeguard against browser extensions / performance profilers accessing undefined timing/event.startTime -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Guard PerformanceEntry / PerformanceObserver and custom timing callers
          var origGetEntries = window.performance && window.performance.getEntries;
          if (origGetEntries) {
            window.performance.getEntries = function() {
              var entries = origGetEntries.apply(this, arguments) || [];
              return entries.filter(function(e) { return e && typeof e.startTime !== 'undefined'; });
            };
          }
        }
      })();
    </script>
